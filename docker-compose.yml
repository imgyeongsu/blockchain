# JackpotChain Multi-Node Docker Compose
# Usage: docker-compose up -d

version: '3.8'

services:
  # Seed Node (mining)
  seed-node:
    build: .
    container_name: jackpot-seed
    ports:
      - "9777:9777"  # P2P
      - "9776:9776"  # RPC
    volumes:
      - seed-data:/app/data
      - seed-wallet:/app/wallet
    command: >
      node --port 9777 --rpc-port 9776 --data-dir /app/data
      --mine --address X6u9TUdcTeaMuLCuSeyGCP5mxczHSdoeMZ
    networks:
      - jackpotnet
    restart: unless-stopped

  # Node 2
  node2:
    build: .
    container_name: jackpot-node2
    ports:
      - "9778:9777"  # P2P
      - "9779:9776"  # RPC
    volumes:
      - node2-data:/app/data
      - node2-wallet:/app/wallet
    command: >
      node --port 9777 --rpc-port 9776 --data-dir /app/data
      --seed seed-node:9777
    depends_on:
      - seed-node
    networks:
      - jackpotnet
    restart: unless-stopped

  # Node 3 (mining)
  node3:
    build: .
    container_name: jackpot-node3
    ports:
      - "9780:9777"  # P2P
      - "9781:9776"  # RPC
    volumes:
      - node3-data:/app/data
      - node3-wallet:/app/wallet
    command: >
      node --port 9777 --rpc-port 9776 --data-dir /app/data
      --seed seed-node:9777
      --mine --address X6u9TUdcTeaMuLCuSeyGCP5mxczHSdoeMZ
    depends_on:
      - seed-node
    networks:
      - jackpotnet
    restart: unless-stopped

networks:
  jackpotnet:
    driver: bridge

volumes:
  seed-data:
  seed-wallet:
  node2-data:
  node2-wallet:
  node3-data:
  node3-wallet:
